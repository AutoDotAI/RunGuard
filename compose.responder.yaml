# Local-only responder drill. Add after compose.demo.yaml in an rg-demo-* project.
services:
  responder:
    image: runguard-api:local
    profiles: [responder]
    command: ["python", "-m", "app.responder", "once"]
    volumes:
      - runguard_data:/data
    environment:
      RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
      RUNGUARD_DEMO_MODE: ${RUNGUARD_DEMO_MODE:?Set true only for a local demo}
      RUNGUARD_DEMO_PROJECT: ${RUNGUARD_DEMO_PROJECT:?Set the isolated rg-demo-* project}
      RUNGUARD_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:?Select the isolated project with -p}
    restart: "no"
