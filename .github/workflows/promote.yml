name: Promote tested RunGuard release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main CI run with a passed development deployment
        required: true
        type: string
      api_digest:
        description: API sha256 digest from the development deployment
        required: true
        type: string
      web_digest:
        description: Web sha256 digest from the development deployment
        required: true
        type: string
      egress_digest:
        description: Egress guard sha256 digest from the development deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify successful development release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source run and digest inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          API_DIGEST: ${{ inputs.api_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          EGRESS_DIGEST: ${{ inputs.egress_digest }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e '.event == "push" and .head_branch == "main" and .conclusion == "success" and .name == "CI"' source-run.json >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: development-deployment
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Match immutable images to passed development smoke
        id: check
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          API_DIGEST: ${{ inputs.api_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          EGRESS_DIGEST: ${{ inputs.egress_digest }}
        run: |
          COMMIT=$(python3 -c 'import json; print(json.load(open("development-deployment.json"))["commit"])')
          test "$COMMIT" = "$(jq -r .head_sha source-run.json)"
          python3 deploy/release.py --commit "$COMMIT" --api "$API_DIGEST" --web "$WEB_DIGEST" --egress "$EGRESS_DIGEST" --source-run-id "$SOURCE_RUN_ID" --evidence development-deployment.json >/dev/null
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  promote-production:
    name: Approved production promotion
    needs: verify-source
    if: vars.CD_PROD_ENABLED == 'true' && vars.CD_SECURITY_GATE_PASSED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: runguard-deployment-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require configured environment approval rule
        env:
          GH_TOKEN: ${{ secrets.CD_ENV_AUDIT_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY/environments/production" | jq -e 'any(.protection_rules[]?; .type == "required_reviewers")' >/dev/null
      - name: Deploy exact development-tested digests and smoke
        env:
          SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit }}
          API_DIGEST: ${{ inputs.api_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          EGRESS_DIGEST: ${{ inputs.egress_digest }}
          CD_SSH_HOST: ${{ secrets.CD_SSH_HOST }}
          CD_SSH_USER: ${{ secrets.CD_SSH_USER }}
          CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
        run: |
          bash deploy/ssh_deploy.sh production "$SOURCE_COMMIT" "$API_DIGEST" "$WEB_DIGEST" "$EGRESS_DIGEST" "$GITHUB_RUN_ID" production-deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-deployment
          path: production-deployment.json
          retention-days: 90
