name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: runguard_ci
          POSTGRES_USER: runguard_ci
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runguard_ci -d runguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUNGUARD_TEST_POSTGRES_URL: postgresql+psycopg://runguard_ci:ci-local-only@127.0.0.1:5432/runguard_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra test
      - name: Run backend unit and integration tests
        working-directory: backend
        run: uv run --no-sync pytest -q
      - name: Verify PostgreSQL integration tests executed
        working-directory: backend
        run: uv run --no-sync pytest -q tests/integration/test_postgres_*.py tests/integration/test_sqlite_import.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run component tests
        working-directory: frontend
        run: npm test
      - name: Check types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    name: Container builds and Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API and worker image
        run: docker build -t runguard-api:ci ./backend
      - name: Keep external responder out of normal image
        run: docker run --rm runguard-api:ci python -c "import importlib.util; assert importlib.util.find_spec('incident_response') is None"
      - name: Build optional pinned responder image
        run: docker build -f backend/Dockerfile.responder -t runguard-responder:ci ./backend
      - name: Check external responder CLI in optional image
        run: docker run --rm runguard-responder:ci incident-response --help
      - name: Build web image
        run: docker build -t runguard-web:ci ./frontend
      - name: Validate local Compose configuration
        run: |
          test ! -e .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml --profile observability --profile responder config --format json |
            python3 -c 'import json,sys; dependencies=json.load(sys.stdin)["services"]["responder"]["depends_on"]; assert dependencies["postgres"]["condition"] == "service_healthy"; assert dependencies["migrate"]["condition"] == "service_completed_successfully"'
      - name: Verify isolated PostgreSQL health and persistence
        run: python3 scripts/postgres_compose_smoke.py
      - name: Verify no-variable first run and existing-data upgrade
        run: python3 scripts/first_run_smoke.py
