name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra test
      - name: Run backend unit and integration tests
        working-directory: backend
        run: uv run --no-sync pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run component tests
        working-directory: frontend
        run: npm test
      - name: Check types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    name: Container builds and Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API and worker image
        run: docker build -t runguard-api:ci ./backend
      - name: Build web image
        run: docker build -t runguard-web:ci ./frontend
      - name: Validate local Compose configuration
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          Path('.env').write_text(
              'RUNGUARD_AUTH_SECRET=' + secrets.token_hex(32) + '\n'
              'RUNGUARD_POSTGRES_PASSWORD=' + secrets.token_hex(32) + '\n'
          )
          PY
          docker compose config --quiet
      - name: Verify isolated PostgreSQL health and persistence
        run: python3 scripts/postgres_compose_smoke.py
