name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra test
      - name: Run backend unit and integration tests
        working-directory: backend
        run: uv run --no-sync pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run component tests
        working-directory: frontend
        run: npm test
      - name: Check types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    name: Container builds and Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API and worker image
        run: docker build -t runguard-api:ci ./backend
      - name: Build web image
        run: docker build -t runguard-web:ci ./frontend
      - name: Validate local Compose configuration
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          Path('.env').write_text(
              'RUNGUARD_AUTH_SECRET=' + secrets.token_hex(32) + '\n'
              'RUNGUARD_POSTGRES_PASSWORD=' + secrets.token_hex(32) + '\n'
          )
          PY
          docker compose config --quiet
      - name: Verify isolated PostgreSQL health and persistence
        run: python3 scripts/postgres_compose_smoke.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - name: Validate digest promotion workflows and host-free Compose
        run: sh deploy/test_cd.sh

  publish:
    name: Publish tested image digests
    needs: [backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
      egress: ${{ steps.egress.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API and worker image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/autodotai/runguard-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/autodotai/runguard-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=
            VITE_ALLOWED_HOSTS=${{ vars.CD_ALLOWED_HOSTS || 'example.com' }}
            VITE_SUMMARIZER_AVAILABLE=false
      - name: Publish worker egress guard image
        id: egress
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/egress
          push: true
          tags: ghcr.io/autodotai/runguard-egress:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate and record published digests
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          python3 deploy/release.py --commit "$GITHUB_SHA" --api "$API_DIGEST" --web "$WEB_DIGEST" --egress "$EGRESS_DIGEST" > release-images.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: release-images.json
          retention-days: 90

  deploy-development:
    name: Deploy tested digests to development
    needs: publish
    if: vars.CD_DEV_ENABLED == 'true' && vars.CD_SECURITY_GATE_PASSED == 'true'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: runguard-deployment-development
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-images
      - name: Validate published digest artifact before host access
        env:
          API_DIGEST: ${{ needs.publish.outputs.api }}
          WEB_DIGEST: ${{ needs.publish.outputs.web }}
          EGRESS_DIGEST: ${{ needs.publish.outputs.egress }}
        run: |
          python3 deploy/release.py --commit "$GITHUB_SHA" --api "$API_DIGEST" --web "$WEB_DIGEST" --egress "$EGRESS_DIGEST" --published-artifact release-images.json >/dev/null
      - name: Deploy and run authenticated smoke
        env:
          API_DIGEST: ${{ needs.publish.outputs.api }}
          WEB_DIGEST: ${{ needs.publish.outputs.web }}
          EGRESS_DIGEST: ${{ needs.publish.outputs.egress }}
          CD_SSH_HOST: ${{ secrets.CD_SSH_HOST }}
          CD_SSH_USER: ${{ secrets.CD_SSH_USER }}
          CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
        run: |
          bash deploy/ssh_deploy.sh development "$GITHUB_SHA" "$API_DIGEST" "$WEB_DIGEST" "$EGRESS_DIGEST" "$GITHUB_RUN_ID" development-deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: development-deployment
          path: development-deployment.json
          retention-days: 90
