[project]
name = "runguard-demo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyJWT>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "litellm>=1.0,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "PyYAML>=6,<7", "openapi-spec-validator>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
