[project]
name = "runguard-demo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
