# Merge with compose.prod.yaml only for digest-based CD releases.
# !reset removes local build contexts so the host cannot rebuild source.
services:
  migrate:
    image: ${RUNGUARD_API_IMAGE:?Set the tested API image digest}
    build: !reset null
  api:
    image: ${RUNGUARD_API_IMAGE:?Set the tested API image digest}
    build: !reset null
  worker:
    image: ${RUNGUARD_API_IMAGE:?Set the tested API image digest}
    build: !reset null
  web:
    image: ${RUNGUARD_WEB_IMAGE:?Set the tested web image digest}
    build: !reset null
  egress_guard:
    image: ${RUNGUARD_EGRESS_IMAGE:?Set the tested egress image digest}
    build: !reset null
