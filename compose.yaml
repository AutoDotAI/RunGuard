name: runguard

x-backend: &backend
  image: runguard-api:local
  build:
    context: ./backend
  networks:
    - default
    - database
  volumes:
    - runguard_local_secrets:/run/runguard-secrets:ro
  environment:
    RUNGUARD_DATABASE_URL: ""
    RUNGUARD_AUTH_SECRET: ""
    RUNGUARD_DATABASE_URL_FILE: /run/runguard-secrets/database_url
    RUNGUARD_AUTH_SECRET_FILE: /run/runguard-secrets/auth_secret

services:
  secrets-init:
    image: runguard-api:local
    build:
      context: ./backend
    user: "0:0"
    command: ["python", "-m", "app.local_bootstrap"]
    environment:
      RUNGUARD_AUTH_SECRET: ${RUNGUARD_AUTH_SECRET:-}
      RUNGUARD_POSTGRES_PASSWORD: ${RUNGUARD_POSTGRES_PASSWORD:-}
      RUNGUARD_POSTGRES_USER: ${RUNGUARD_POSTGRES_USER:-runguard}
      RUNGUARD_POSTGRES_DB: ${RUNGUARD_POSTGRES_DB:-runguard}
    volumes:
      - runguard_local_secrets:/run/runguard-secrets
      - postgres_data:/pgdata:ro
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${RUNGUARD_POSTGRES_DB:-runguard}
      POSTGRES_USER: ${RUNGUARD_POSTGRES_USER:-runguard}
      POSTGRES_PASSWORD_FILE: /run/runguard-secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - runguard_local_secrets:/run/runguard-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - database
    ports:
      - "127.0.0.1:${RUNGUARD_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - python -c 'from app.auth import TokenService; TokenService()' && alembic upgrade head
    restart: "no"

  api:
    <<: *backend
    # Server-side model catalog and optional LiteLLM credentials stay out of web.
    env_file:
      - path: ${RUNGUARD_MODEL_ENV_FILE:-.env}
        required: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RUNGUARD_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    env_file:
      - path: ${RUNGUARD_MODEL_ENV_FILE:-.env}
        required: false
    environment:
      RUNGUARD_DATABASE_URL: ""
      RUNGUARD_AUTH_SECRET: ""
      RUNGUARD_DATABASE_URL_FILE: /run/runguard-secrets/database_url
      RUNGUARD_AUTH_SECRET_FILE: /run/runguard-secrets/auth_secret
      # Host subscription credentials are never mounted into this container.
      RUNGUARD_MODEL_PROVIDER: ${RUNGUARD_MODEL_PROVIDER:-disabled}
    command: ["python", "-m", "app.workers.runner"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: runguard-web:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_DEMO_MODE: ${RUNGUARD_DEMO_MODE:-false}
        VITE_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RUNGUARD_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  # Preserve the old SQLite named volume for the verified one-time import.
  # No active service mounts it after the PostgreSQL cutover.
  runguard_data:
  postgres_data:
  runguard_local_secrets:

networks:
  database:
    driver: bridge
