name: runguard

x-backend: &backend
  image: runguard-api:local
  build:
    context: ./backend
  volumes:
    - runguard_data:/data
  environment:
    RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
    RUNGUARD_AUTH_SECRET: ${RUNGUARD_AUTH_SECRET:?Set a stable secret of at least 32 bytes in .env}

services:
  migrate:
    <<: *backend
    command:
      - sh
      - -ec
      - python -c 'from app.auth import TokenService; TokenService()' && alembic upgrade head
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    env_file: .env
    environment:
      RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
      RUNGUARD_AUTH_SECRET: ${RUNGUARD_AUTH_SECRET:?Set a stable secret of at least 32 bytes in .env}
      # Host subscription credentials are never mounted into this container.
      RUNGUARD_MODEL_PROVIDER: ${RUNGUARD_MODEL_PROVIDER:-disabled}
    command: ["python", "-m", "app.workers.runner"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: runguard-web:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  runguard_data:
