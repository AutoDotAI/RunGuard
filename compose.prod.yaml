name: runguard-public

x-backend: &backend
  image: runguard-api:${RUNGUARD_IMAGE_TAG:-local}
  build:
    context: ./backend
  volumes:
    - runguard_data:/data
  environment:
    RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
    RUNGUARD_PUBLIC_MODE: "1"
    RUNGUARD_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:?Set up to five exact trusted public hosts}

services:
  migrate:
    <<: *backend
    environment:
      RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
      RUNGUARD_PUBLIC_MODE: "1"
      RUNGUARD_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:?Set trusted public hosts}
      RUNGUARD_AUTH_SECRET: ${RUNGUARD_AUTH_SECRET:?Set a stable, unique secret of at least 32 bytes}
    command: ["sh", "-ec", "python -c 'from app.auth import TokenService; from app.outbound import allowed_public_hosts; TokenService(); allowed_public_hosts()' && alembic upgrade head"]
    networks: [appnet]
    restart: "no"

  api:
    <<: *backend
    environment:
      RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
      RUNGUARD_PUBLIC_MODE: "1"
      RUNGUARD_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:?Set trusted public hosts}
      RUNGUARD_AUTH_SECRET: ${RUNGUARD_AUTH_SECRET:?Set a stable, unique secret of at least 32 bytes}
      RUNGUARD_CORS_ORIGINS: https://${RUNGUARD_PUBLIC_HOST:?Set your controlled HTTPS hostname}
      RUNGUARD_SUMMARIZER_AVAILABLE: ${RUNGUARD_SUMMARIZER_AVAILABLE:-false}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [appnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  egress_guard:
    build:
      context: ./deploy/egress
    cap_add: [NET_ADMIN]
    networks: [egressnet]
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/runguard-egress-ready && iptables -S OUTPUT | grep -q -- '-P OUTPUT DROP' && ip6tables -S OUTPUT | grep -q -- '-P OUTPUT DROP'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  egress_probe:
    <<: *backend
    profiles: [security-probe]
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    networks: [egressnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read()"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: "no"

  worker:
    <<: *backend
    environment:
      RUNGUARD_DATABASE_URL: sqlite:////data/runguard.db
      RUNGUARD_PUBLIC_MODE: "1"
      RUNGUARD_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:?Set trusted public hosts}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["python", "-m", "app.workers.runner"]
    network_mode: "service:egress_guard"
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      egress_guard:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: runguard-web:${RUNGUARD_IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_ALLOWED_HOSTS: ${RUNGUARD_ALLOWED_HOSTS:?Set trusted public hosts}
        VITE_SUMMARIZER_AVAILABLE: ${RUNGUARD_SUMMARIZER_AVAILABLE:-false}
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      RUNGUARD_PUBLIC_HOST: ${RUNGUARD_PUBLIC_HOST:?Set your controlled HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [appnet, publicnet]
    restart: unless-stopped

networks:
  appnet:
    internal: true
  egressnet: {}
  publicnet: {}

volumes:
  runguard_data: {}
  caddy_data: {}
  caddy_config: {}
